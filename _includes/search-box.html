<div class="search-box">
  <input
    type="text"
    class="search-input"
    oninput="onSearchInput(this)"
    placeholder="Busca articulos en el sitio..."
  />
  <button
    disabled
    data-tooltip="Limpiar busqueda"
    aria-label="limpiar busqueda"
    onclick="onSearchClear()"
  >
    {% include icon.html icon="fa-solid fa-magnifying-glass" %}
  </button>
</div>
